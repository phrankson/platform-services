# platform-sandbox overlay: patches on top of environments/base -- here,
# just the Istio chart version (istio.yaml). This is how a version bump
# gets tested in one environment before being copied into the next
# overlay (progressive rollout), without ever touching base or the other
# environments' overlays.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../base

patches:
  - path: istio.yaml

labels:
  - pairs:
      env: platform-sandbox
    includeSelectors: true
    includeTemplates: true
