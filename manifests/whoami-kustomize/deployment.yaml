apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami-kustomize
  labels:
    app.kubernetes.io/name: whoami-kustomize
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: whoami-kustomize
  template:
    metadata:
      labels:
        app.kubernetes.io/name: whoami-kustomize
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.10.3
          ports:
            - containerPort: 80
